name: Build and Upload Android Build

on:
  workflow_dispatch:
    inputs:
      build-defines:
        type: string
        description: Build defines to use
        default: '-DGITHUB_BUILD'
      save-artifact:
        type: boolean
        description: Save the build artifact to Github Actions
        default: true

jobs:

  build-game-on-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      BUILD_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Lix/Haxe Environment
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Config haxelib
        run: |
          haxelib --never newrepo
          echo "HAXEPATH=$(haxelib config)" >> "$GITHUB_ENV"

      - name: Install HMM and dependencies
        run: |
          haxelib install hmm --quiet
          
          # Instalamos las versiones oficiales estables desde el servidor normal de Haxelib
          haxelib install lime 8.2.2 --quiet
          haxelib install hxcpp --quiet
          haxelib install jsonpatch 1.1.0 --quiet
          haxelib install jsonpath 1.1.0 --quiet
          
          # 1. Limpiamos hmm.json para usar las que ya instalamos arriba de forma global
          python3 -c "
          import json
          with open('hmm.json', 'r') as f:
              data = json.load(f)
          if 'dependencies' in data:
              data['dependencies'] = [
                  d for d in data['dependencies'] 
                  if d.get('name') not in ['hxcpp', 'lime', 'jsonpatch', 'jsonpath']
              ]
          with open('hmm.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          # 2. Modificamos project.hxp sin romper corchetes
          python3 -c "
          with open('project.hxp', 'r') as f:
              code = f.read()
          
          code = code.replace('.deliveryPackName', '.__deliveryPackName_disabled')
          code = code.replace('adaptiveIcon', 'icon')
          code = code.replace('.xmlChildren', '.__xmlChildren_disabled')
          
          with open('project.hxp', 'w') as f:
              f.write(code)
          "
          
          haxelib run hmm install -q

      - name: Configure Lime for Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDANDROID_NDK $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Build game (Android)
        run: |
          haxelib run lime build android -v -release $BUILD_DEFINES
        timeout-minutes: 60

      - name: Save APK artifact to Github Actions
        if: ${{ github.event.inputs.save-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          
